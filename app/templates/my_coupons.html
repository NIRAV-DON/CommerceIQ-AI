{% extends "layout.html" %}
{% block content %}

<h2>🎁 My Coupons</h2>

{% if recommended_users %}
<table style="width:100%; margin-top:20px;">
    <tr>
        <th>Code</th>
        <th>CLV</th>
        <th>Expiry</th>
    </tr>

    {% for user in recommended_users %}
    <tr>
        <td>{{ user.coupon }}</td>
        <td>{{ user.clv }}</td>
        <td>N/A</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No active coupons available.</p>
{% endif %}

{% endblock %}
