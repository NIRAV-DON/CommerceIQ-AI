{% extends "layout.html" %}
{% block content %}

<div class="container">
    <h2>Welcome, {{ current_user.username }}</h2>
    <p>{{ current_user.email }} ({{ current_user.role }})</p>

    <hr>

    <div class="stats">
        <div class="card">📦 Products: {{ total_products }}</div>
        <div class="card">🛒 Cart Items: {{ cart_count }}</div>
    </div>

    <h3>Categories</h3>
    <div class="categories">
        <div class="card">📱 Mobiles</div>
        <div class="card">💻 Laptops</div>
        <div class="card">🎧 Accessories</div>
    </div>
</div>

{% endblock %}
