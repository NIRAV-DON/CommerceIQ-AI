{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2>All Users</h2>

    <table border="1" cellpadding="10" cellspacing="0" width="100%">
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Total Orders</th>
        </tr>

        {% for user in users %}
        <tr>
            <!-- 🔥 USERNAME CLICKABLE -->
            <td>
                <a href="{{ url_for('main.admin_user_detail', user_id=user.user_id) }}">
                    {{ user.username }}
                </a>
            </td>

            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.orders|length }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
