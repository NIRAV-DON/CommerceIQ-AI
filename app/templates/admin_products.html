{% extends "layout.html" %}
{% block content %}

<h2>All Products</h2>

<table border="1" width="100%">
<tr>
  <th>Name</th>
  <th>Category</th>
  <th>Price</th>
  <th>Stock</th>
</tr>

{% for p in products %}
<tr>
  <td>{{ p.name }}</td>
  <td>{{ p.category }}</td>
  <td>₹{{ p.price }}</td>
  <td>{{ p.stock_quantity }}</td>
</tr>
{% endfor %}
</table>

{% endblock %}
