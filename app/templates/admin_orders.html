{% extends "layout.html" %}
{% block content %}

<h2>All Orders</h2>


<form method="GET" class="order-filter">

    <select name="status">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Shipped">Shipped</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <input type="date" name="start_date" value="{{ start_date }}">
    <input type="date" name="end_date" value="{{ end_date }}">

    <button type="submit" class="btn">Filter</button>

    <a href="{{ url_for('main.admin_orders') }}" class="btn">Reset</a>

</form>

<a href="{{ url_for('main.orders_pdf',
                    status=status,
                    start_date=start_date,
                    end_date=end_date) }}"
   class="btn"
   style="margin:15px 0;">
   Download PDF
</a>


<table border="1" cellpadding="10" width="100%">
    <tr>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Total Amount</th>
        <th>Status</th>
        
    </tr>

    {% for order in orders %}
    <tr>
        <td>#{{ order.order_id }}</td>
        <td>{{ order.user_id }}</td>
        <td>₹ {{ order.total_amount }}</td>

        <td>
           <form method="POST" action="{{ url_for('main.update_order_status', order_id=order.order_id) }}">
    <select name="status">
        <option value="Pending" {% if order.status=='Pending' %}selected{% endif %}>Pending</option>
        <option value="Confirmed" {% if order.status=='Confirmed' %}selected{% endif %}>Confirmed</option>
        <option value="Shipped" {% if order.status=='Shipped' %}selected{% endif %}>Shipped</option>
        <option value="Out for Delivery" {% if order.status=='Out for Delivery' %}selected{% endif %}>
            Out for Delivery
        </option>
        <option value="Delivered" {% if order.status=='Delivered' %}selected{% endif %}>Delivered</option>
        <option value="Cancelled" {% if order.status=='Cancelled' %}selected{% endif %}>Cancelled</option>
    </select>

    <button type="submit" class="btn btn-primary">
        Update Status
    </button>
</form>


        </td>

        
            </form>
        
    </tr>
    {% endfor %}
</table>

{% endblock %}
