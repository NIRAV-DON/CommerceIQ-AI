{% extends "layout.html" %}
{% block content %}

<h2 class="page-title">Our Products</h2>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">

        <a href="{{ url_for('main.product', product_id=product.product_id) }}">
            <img src="{{ product.image_url or url_for('static', filename='img/no-image.png') }}">
        </a>

        <h3>
            <a href="{{ url_for('main.product', product_id=product.product_id) }}">
                {{ product.name }}
            </a>
        </h3>

        <p class="price">₹{{ product.price }}</p>

        <a href="{{ url_for('main.product', product_id=product.product_id) }}" class="btn">
            View Details
        </a>

    </div>
    {% endfor %}
</div>

{% endblock %}
