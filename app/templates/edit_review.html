{% extends "layout.html" %}
{% block content %}

<h2>Edit Review</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    <label>Rating</label>
    {{ form.rating }}

    <label>Comment</label>
    {{ form.comment }}

    <button type="submit" class="btn">
        Update Review
    </button>
</form>

{% endblock %}
