{% extends "layout.html" %}
{% block content %}

<div class="checkout-wrapper">

    <div class="checkout-card">
        <h2>Checkout</h2>

        <form method="POST">

            <label>Shipping Address</label>
            <textarea name="shipping_address" class="modern-input"></textarea>

            <label>Payment Method</label>
            <div class="payment-options">
                <label><input type="radio" name="payment_method" value="COD"> Cash on Delivery</label>
                <label><input type="radio" name="payment_method" value="UPI"> UPI</label>
                <label><input type="radio" name="payment_method" value="Card"> Card</label>
            </div>

            <label>Coupon</label>
            <input type="text" name="coupon_code" class="modern-input">

            <button type="submit" class="modern-btn">
                Place Order
            </button>

        </form>
    </div>

</div>

{% endblock %}
