{% extends "layout.html" %}
{% block content %}
    <h1>Checkout</h1>
    <form method="POST" action="">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {{ form.address.label(class="form-control-label") }}
            {{ form.address(class="form-control", rows="4") }}
        </div>
        <div class="form-group">
            {{ form.submit(class="btn") }}
        </div>
    </form>
{% endblock %}
