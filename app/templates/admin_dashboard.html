{% extends "layout.html" %}
{% block content %}

<div class="container">

    <h1 style="margin-bottom:2rem;">Admin Dashboard</h1>

    <!-- STATS CARDS -->
    <div class="dashboard-grid">

        <div class="dash-card">
            <h3>Total Products</h3>
            <p>{{ total_products }}</p>
        </div>

        <div class="dash-card">
            <h3>Total Orders</h3>
            <p>{{ total_orders }}</p>
        </div>

        <div class="dash-card">
            <h3>Total Users</h3>
            <p>{{ total_users }}</p>
        </div>

        <div class="dash-card">
            <h3>Total Sales</h3>
            <p>₹{{ total_sales }}</p>
        </div>

        <div class="dash-card warning">
            <h3>Low Stock</h3>
            <p>{{ low_stock_products }}</p>
        </div>

    </div>

    <!-- CHART -->
    <div class="chart-box">
        <h2>Sales Forecast (AI)</h2>
        <canvas id="salesChart"></canvas>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const forecastData = {{ forecast_data | tojson }};

    const labels = forecastData.map(item => item.date);
    const values = forecastData.map(item => item.predicted_sales);

    new Chart(document.getElementById('salesChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Predicted Sales',
                data: values,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37,99,235,0.2)',
                tension: 0.4,
                fill: true
            }]
        }
    });
</script>

{% endblock %}
