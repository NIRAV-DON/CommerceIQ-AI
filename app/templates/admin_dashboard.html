{% extends "layout.html" %}
{% block content %}

<div class="admin-dashboard">

    <h1>Admin Dashboard</h1>

    <div class="admin-cards">

        <div class="admin-card">
            <h3>Total Products</h3>
            <p>{{ total_products }}</p>
        </div>

        <div class="admin-card">
            <h3>Total Orders</h3>
            <p>{{ total_orders }}</p>
        </div>

        <div class="admin-card">
            <h3>Total Users</h3>
            <p>{{ total_users }}</p>
        </div>

        <div class="admin-card">
            <h3>Total Sales</h3>
            <p>₹ {{ total_sales }}</p>
        </div>

        <div class="admin-card warning">
            <h3>Low Stock Products</h3>
            <p>{{ low_stock_products }}</p>
        </div>

    </div>

</div>
<hr style="margin:3rem 0;">

<h2>AI Sales Forecast (Next 30 Days)</h2>

<canvas id="salesChart" height="100"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const forecastData = JSON.parse('{{ forecast_data | default([]) | tojson | safe }}');

    const labels = forecastData.map(item => item.date);
    const values = forecastData.map(item => item.predicted_sales);

    new Chart(document.getElementById('salesChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Predicted Sales',
                data: values,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37,99,235,0.2)',
                tension: 0.4
            }]
        }
    });
</script>


{% endblock %}
